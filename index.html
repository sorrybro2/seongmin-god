<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101214">
    <title>현장 사진 Pro</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFC400'/%3E%3Crect x='12' y='30' width='40' height='22' fill='%23fff' stroke='%23111' stroke-width='3'/%3E%3Cpath d='M26 30v22M12 41h40' stroke='%23111' stroke-width='3'/%3E%3C/svg%3E">
    <script>
        // 첫 화면 깜빡임 방지: 저장된 테마를 렌더링 전에 적용
        try {
            var t = localStorage.getItem('photo_pro_theme') === 'light' ? 'light' : 'dark';
            document.documentElement.dataset.theme = t;
            document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#E9ECEF' : '#101214';
        } catch (e) {}
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
